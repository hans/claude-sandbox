name: Release

# Push a multi-arch image to Docker Hub when a version tag is pushed.
#   git tag v0.2 && git push origin v0.2
# Publishes jrgauthier/claude-sandbox:<tag> and :latest for linux/amd64 + arm64.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — your Docker Hub account (jrgauthier)
#   DOCKERHUB_TOKEN     — a Docker Hub access token (Account → Security), NOT your password
on:
  push:
    tags:
      - "v*"

jobs:
  push-image:
    name: build & push (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # enables cross-arch (arm64 on amd64 runner)
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jrgauthier/claude-sandbox
          # type=ref keeps the tag verbatim (v0.1 → :v0.1), matching the existing convention.
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
